name: Runners Practice

on:
    workflow_dispatch

jobs:
    PrintWindowsRunner:
        runs-on: windows-latest
        steps:
            - name: Print Windows Runner Name
              run: echo "Runner name is- ${{ runner.os }}"
    PrintingUbuntuRunner:
        runs-on: ubuntu-latest
        steps:
            - name: Print Ubuntu Runner Name
              run: echo "Runner Name - ${{ runner.os }}"

    PrintingMacOSrunner:
        runs-on: macos-latest
        steps:
            - name: Print MacOS Runner Name
              run: echo "Runner name- ${{ runner.os }}"