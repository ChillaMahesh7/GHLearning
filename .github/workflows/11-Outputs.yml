name: 11-Outputs

on:
    push

jobs:
    input:
        runs-on: ubuntu-latest
        outputs:
            name: ${{ steps.name.outputs.name }}
        steps:
            - name: give input value
              id: name
              run: echo "name=mahesh" >> $GITHUB_OUTPUT

    output:
        runs-on: ubuntu-latest
        needs: input
        steps:
            - name: show input value
              run: echo "${{ needs.input.outputs.name }}"