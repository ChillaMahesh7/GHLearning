name: Event Actvity types

on:
    pull_request:
        types: [ opened ]
        branches:
            - main
jobs:
    PullRequest:
        runs-on: ubuntu-latest
        steps:
            - name: Event Name
              run: echo "${{ github.event_name }}"
            - name: branch name
              run: echo "${{ github.ref_name }}"
        
